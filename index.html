<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>2D MMORPG</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05070b}
iframe{display:block;width:100%;height:100%;border:0;background:#05070b}
</style>
</head>
<body>
<iframe id="game" src="./game.html" title="2D MMORPG"></iframe>
<script>
const frame=document.getElementById('game');
let villageNpcs=null;
function isolateForestNpcs(){
  try{
    const w=frame.contentWindow;
    if(!w || !w.game || !w.game.world) return;
    const g=w.game;
    if(!villageNpcs && Array.isArray(g.npcs)) villageNpcs=g.npcs.slice();
    if(g.world.mapId==='mistForest'){
      g.npcs=[];
    }else if(g.world.mapId==='village' && villageNpcs){
      g.npcs=villageNpcs;
    }
  }catch(_){ }
}
frame.addEventListener('load',()=>{ setTimeout(isolateForestNpcs,250); });
setInterval(isolateForestNpcs,200);
</script>
</body>
</html>
