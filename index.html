<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>2D MMORPG</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05070b}
iframe{display:block;width:100%;height:100%;border:0;background:#05070b}
</style>
</head>
<body>
<iframe id="game" src="./game.html" title="2D MMORPG"></iframe>
<script>
const frame=document.getElementById('game');
frame.addEventListener('error',()=>{ window.location.href='./game.html'; });
setTimeout(()=>{
  try{
    if(!frame.contentDocument || !frame.contentDocument.body){ window.location.href='./game.html'; }
  }catch(_){ }
},1500);
</script>
</body>
</html>
