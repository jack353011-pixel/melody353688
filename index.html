<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>2D MMORPG</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05070b}
iframe{display:block;width:100%;height:100%;border:0;background:#05070b}
</style>
</head>
<body>
<iframe id="game" title="2D MMORPG"></iframe>
<script>
(async function(){
  const frame=document.getElementById('game');
  try{
    if('serviceWorker' in navigator){
      await navigator.serviceWorker.register('./sw.js?v=2',{scope:'./'});
      await navigator.serviceWorker.ready;
      await new Promise(r=>setTimeout(r,500));
    }
  }catch(e){console.warn('Service worker registration failed',e);}
  frame.src='./game.html?v=20260830-forest-npc-fix3';
})();
</script>
</body>
</html>
